version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cies-backend
    restart: always
    environment:
      APP_ENV: production
      APP_PORT: 8080
      APP_URL: http://localhost:8082
      SQLITE_PATH: data/cies.db
      CIES_MODEL_URL: ${CIES_MODEL_URL:-http://host.docker.internal:8081}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-cies}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-cies-llm-v1}
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cies-frontend
    restart: always
    ports:
      - "8082:80"
    depends_on:
      - backend
